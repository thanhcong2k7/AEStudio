    <script>
      (function() {
        var origFetch = window.fetch;

        // 1. Define accessor with setter on Window.prototype if present
        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() { return origFetch; },
              set: function(fn) { origFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        // 2. Define writable property directly on window
        try {
          Object.defineProperty(window, 'fetch', {
            value: origFetch,
            writable: true,
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return origFetch; },
              set: function(fn) { origFetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        // 3. Catch and suppress any extension or fetch-interceptor errors
        var isExtensionError = function(msg, src, err) {
          var str = String(msg || '') + ' ' + String(src || '') + ' ' + (err && err.stack ? String(err.stack) : '');
          return str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('requests.js') !== -1 ||
                 str.indexOf('Cannot set property fetch') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message, e.filename, e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var oldOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (isExtensionError(msg, src, err)) {
            return true;
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          if (isExtensionError(reason && reason.message, '', reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
